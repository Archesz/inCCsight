[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

# ── Package metadata ──────────────────────────────────────────────────────────
[project]
name            = "inccsight"
version         = "0.2.0"
description     = "DTI Corpus Callosum analysis and visualization tool"
requires-python = ">=3.9"
authors         = [{name = "Miclab", email = "inccsight@miclab.dev"}]
license         = {text = "MIT"}
keywords        = ["DTI", "MRI", "corpus callosum", "neuroimaging"]
classifiers     = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# Web-server runtime dependencies
# Analysis deps (nibabel, numpy, scipy, numba…) live in methods/requirements.txt
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "sse-starlette>=1.6",
    "pydantic>=2.0",
]

# ── CLI entry point ───────────────────────────────────────────────────────────
# After `pip install .`:  run `inccsight` from your project directory.
[project.scripts]
inccsight = "inccsight.__main__:main"

# ── Package discovery ─────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where   = ["."]
include = ["inccsight*"]

# Bundle the pre-built React app (populated by scripts/build_package.sh)
[tool.setuptools.package-data]
inccsight = ["static/**/*", "static/*"]
